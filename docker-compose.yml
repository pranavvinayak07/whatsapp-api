version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vivegaa_whatsapp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vivegaa_whatsapp
      POSTGRES_USER: whatsapp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vivegaa_secure_db_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp_user -d vivegaa_whatsapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp_internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vivegaa_whatsapp_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://whatsapp_user:${POSTGRES_PASSWORD:-vivegaa_secure_db_pass_2026}@postgres:5432/vivegaa_whatsapp?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-default_secret_please_change_in_env_32chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-default_encryption_key_change_in_env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-vw_live_internal_secret_key_2026}
      BAILEYS_AUTH_DIR: /app/auth
      MEDIA_STORAGE_DIR: /app/media
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://whatsapp.vivegaaerp.in}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MESSAGE_QUEUE_ENABLED: "true"
      DEFAULT_COUNTRY_CODE: "91"
    volumes:
      - baileys_auth:/app/auth
      - media_storage:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - whatsapp_internal

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vivegaa_whatsapp_dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api
      INTERNAL_API_URL: http://api:3001
    depends_on:
      - api
    ports:
      - "3000:3000"
    networks:
      - whatsapp_internal

volumes:
  postgres_data:
    driver: local
  baileys_auth:
    driver: local
  media_storage:
    driver: local

networks:
  whatsapp_internal:
    driver: bridge
